name: Managed Classify service
on:
  pull_request:
    paths:
      - 'app/**'
      - 'bindings/**'
      - '.github/workflows/managed-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build and test service
        working-directory: app
        shell: bash
        run: |
          go test ./...
          go build -o "$RUNNER_TEMP/classify-test.exe" .
      - name: Prepare Linux CI user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Verify non-elevated Windows startup and stop
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: app
        run: |
          go build -o "$env:RUNNER_TEMP/winuser.exe" ./tests/winuser
          $cli = Join-Path $env:USERPROFILE 'classify-ci.exe'
          Copy-Item "$env:RUNNER_TEMP/classify-test.exe" $cli
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          icacls.exe $cli /grant "*${sid}:(RX)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/winuser.exe" powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tests/standard_windows.ps1 -Cli $cli
          exit $LASTEXITCODE
      - name: Exercise OS-managed lifecycle
        shell: bash
        run: python app/tests/managed_quickstart.py "$RUNNER_TEMP/classify-test.exe"
      - name: Exercise service-enabled language packages
        if: runner.os == 'Windows' || runner.os == 'Linux'
        shell: bash
        run: |
          languages="python node go"
          if [[ "$RUNNER_OS" == "Windows" && "$RUNNER_ARCH" == "X64" ]]; then
            export CLASSIFY_TEST_BASH="$(cygpath -w /usr/bin/bash)"
            export JAVA_HOME="$JAVA_HOME_21_X64"
            export PATH="$(cygpath -u "$JAVA_HOME")/bin:$PATH"
            languages="$languages java csharp rust"
          fi
          python app/tests/binding_service.py "$RUNNER_TEMP/classify-test.exe" $languages
      - name: Read service diagnostics on failure
        if: failure()
        shell: bash
        run: cat ~/.nativelang/classify/service/service.log || true
