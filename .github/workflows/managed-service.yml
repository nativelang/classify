name: Managed Classify service
on:
  pull_request:
    paths:
      - 'app/**'
      - 'bindings/**'
      - '.github/workflows/managed-service.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build and test service
        working-directory: app
        shell: bash
        run: |
          go test ./...
          go build -o "$RUNNER_TEMP/classify-test.exe" .
      - name: Prepare Linux CI user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Exercise OS-managed lifecycle
        shell: bash
        run: python app/tests/managed_quickstart.py "$RUNNER_TEMP/classify-test.exe"
