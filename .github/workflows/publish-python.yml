name: Publish Python to PyPI
run-name: Publish Python ${{ inputs.version }} to PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: GitHub release version
        required: true
        type: string

permissions: {}
concurrency: publish-python-to-pypi

jobs:
  publish:
    if: github.repository == 'nativelang/classify' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Verify the released wheel
        run: python3 release/registry.py python "$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          skip-existing: true
