name: Set up native qualification toolchains
description: Install the compilers and runtimes for all eight Classify clients.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.13'
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: '22.18.0'
        package-manager-cache: false
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: '1.26.11'
        cache: false
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
      with:
        distribution: microsoft
        java-version: '21'
        architecture: ${{ runner.arch == 'ARM64' && 'aarch64' || 'x64' }}
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: '10.0.x'
    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
    - name: Select native Rust toolchain
      shell: python {0}
      run: |
        import os, subprocess
        arch = {"ARM64": "aarch64", "X64": "x86_64"}[os.environ["RUNNER_ARCH"]]
        os_target = {"Linux": "unknown-linux-gnu", "macOS": "apple-darwin",
                     "Windows": "pc-windows-msvc"}[os.environ["RUNNER_OS"]]
        toolchain = f"1.88.0-{arch}-{os_target}"
        subprocess.run(["rustup", "toolchain", "install", toolchain, "--profile", "minimal"], check=True)
        with open(os.environ["GITHUB_ENV"], "a") as f:
            print(f"RUSTUP_TOOLCHAIN={toolchain}", file=f)
