[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "nativelang-classify"
version = "0.2.3"
description = "Classify text locally using categories you choose."
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[tool.setuptools]
packages = ["nativelang_classify"]

[tool.setuptools.package-data]
nativelang_classify = ["bootstrap.sh", "install.ps1"]
